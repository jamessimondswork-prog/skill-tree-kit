<title>My Skill Tree</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: arena HUD. Rank badge + boost bar on top, Today's run, then the mission card, skill cards, topic paths and match history. Views swap in place. Dark-first. */
:root {
  --bg: #0a0e1c; --panel: #121a2e; --panel2: #0e1526; --ink: #e9edf7; --muted: #8d99b8; --line: #243052;
  --boost: #ff7a1a; --boost-soft: #3b2211; --good: #3ddc84; --good-soft: #10301f; --bad: #ff5c5c; --bad-soft: #3a1515;
  --bronze: #c8793a; --silver: #b9c4d6; --gold: #f2c14e; --plat: #5fe3d0; --diamond: #a98bff;
  --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef1f7; --panel: #ffffff; --panel2: #f4f6fb; --ink: #121a2c; --muted: #56627c; --line: #d3dae6;
  --boost: #e8610f; --boost-soft: #fde3d2; --good: #1a8a4c; --good-soft: #d9f1e3; --bad: #c43535; --bad-soft: #f8dddd;
  --bronze: #a8602a; --silver: #6f7d95; --gold: #b8860b; --plat: #178f80; --diamond: #6b48e6; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #eef1f7; --panel: #ffffff; --panel2: #f4f6fb; --ink: #121a2c; --muted: #56627c; --line: #d3dae6;
  --boost: #e8610f; --boost-soft: #fde3d2; --good: #1a8a4c; --good-soft: #d9f1e3; --bad: #c43535; --bad-soft: #f8dddd;
  --bronze: #a8602a; --silver: #6f7d95; --gold: #b8860b; --plat: #178f80; --diamond: #6b48e6; color-scheme: light }

body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
html, body { overflow-x: hidden; }
.wrap, .view, .card, .speech, .prose, .mission, .skill, .trophy { overflow-wrap: anywhere; }
.wrap > *, .view > * { min-width: 0; max-width: 100%; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 1.9rem; line-height: 1.05; }
h2 { font-size: .95rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
h3 { font-size: 1.15rem; }
p { margin: 0; }
a { color: var(--plat); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-display); font-size: .74rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.view { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
button { font: 600 .95rem var(--f-body); border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 10px 16px; cursor: pointer; }
button:hover { border-color: var(--plat); }
button:focus-visible, .node button:focus-visible { outline: 3px solid var(--plat); outline-offset: 2px; }
button.go { background: var(--boost); border-color: var(--boost); color: #fff; font-family: var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 12px 22px; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); border-radius: 0; }
button.go:hover { filter: brightness(1.1); }
button.ghost { background: transparent; }
button.icon { padding: 8px 10px; line-height: 1; }
button:disabled { opacity: .5; cursor: default; }

/* tiers */
.t-bronze { --tier: var(--bronze); } .t-silver { --tier: var(--silver); } .t-gold { --tier: var(--gold); } .t-plat { --tier: var(--plat); } .t-diamond { --tier: var(--diamond); }
.hex { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
.hex polygon { fill: var(--tier); }
.hex text { font: 700 34px var(--f-mono); fill: var(--bg); text-anchor: middle; dominant-baseline: central; }

/* HUD */
.hud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; position: relative; overflow: hidden; }
.hud::after { content: ""; position: absolute; inset: auto 0 0 0; height: 3px; background: linear-gradient(90deg, var(--tier), transparent); }
.badge { width: 84px; height: 120px; position: relative; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--tier) 45%, transparent)); }
#avatar, #flame { position: absolute; inset: 0; width: 84px; height: 120px; image-rendering: pixelated; image-rendering: crisp-edges; }
#flame { opacity: .85; }
#avatar { animation: bob 2.4s ease-in-out infinite; }
#pet { position: absolute; right: -16px; bottom: 0; width: 24px; height: 24px; image-rendering: pixelated; image-rendering: crisp-edges; animation: bob 1.8s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
.hud-meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hud-meta h1 { color: var(--tier); }
.boost { display: flex; flex-direction: column; gap: 4px; }
.cells { display: flex; gap: 3px; }
.cells i { flex: 1; height: 12px; background: var(--line); transform: skewX(-18deg); border-radius: 2px; }
.cells i.on { background: var(--boost); box-shadow: 0 0 6px color-mix(in srgb, var(--boost) 60%, transparent); }
.row { display: flex; justify-content: space-between; gap: 8px; font-size: .82rem; color: var(--muted); }
.side { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.chip { font: 600 .82rem var(--f-mono); padding: 5px 10px; border-radius: 6px; background: var(--boost-soft); color: var(--boost); white-space: nowrap; }
.chip.cold { background: var(--panel2); color: var(--muted); }
.xp-float { position: absolute; left: 110px; top: 10px; font: 700 1.1rem var(--f-mono); color: var(--boost); animation: rise 1.2s ease-out forwards; pointer-events: none; }
@keyframes rise { from { opacity: 1; transform: translateY(0) } to { opacity: 0; transform: translateY(-36px) } }

/* today's run */
.today { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 12px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.today .label { white-space: nowrap; }
.goal { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: .85rem; }
.goal .bar { height: 6px; }
.goal.hit { color: var(--good); }

/* mission */
.mission { background: linear-gradient(135deg, var(--panel), var(--panel2)); border: 1px solid var(--line); border-left: 4px solid var(--boost); border-radius: 10px; padding: 18px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.mission > div { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* skill cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 12px; }
.skill { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px 12px; align-items: center; }
.skill .hex { width: 44px; height: 44px; grid-row: span 2; }
.skill h3 { font-size: 1rem; min-width: 0; }
.skill .tag { grid-column: 2; }
.skill .bars { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.tag { font: 500 .7rem var(--f-display); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--tier, var(--plat)); border-radius: inherit; transition: width .5s; }
.bar.sharp i { background: var(--good); }
.bar.sharp.dull i { background: var(--boost); }

/* topics + quest path */
.list { display: flex; flex-direction: column; gap: 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; }
.tile:hover { border-color: var(--plat); }
.tile > div { min-width: 0; }
.tile small { color: var(--muted); display: block; }
.pips { display: flex; gap: 4px; flex-shrink: 0; }
.pips i { width: 12px; height: 12px; border-radius: 2px; background: var(--line); transform: skewX(-15deg); }
.pips i.on { background: var(--good); }
.pips i.now { background: var(--boost); }
.path { list-style: none; margin: 0; padding: 0; position: relative; display: flex; flex-direction: column; gap: 10px; }
.path::before { content: ""; position: absolute; left: 19px; top: 20px; bottom: 20px; width: 2px; background: var(--line); }
.node button { width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 10px 12px 10px 8px; font: inherit; }
.node .dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-content: center; font: 700 .9rem var(--f-mono); background: var(--panel2); border: 2px solid var(--line); color: var(--muted); position: relative; z-index: 1; }
.node.done .dot { background: var(--good); border-color: var(--good); color: var(--bg); }
.node.now .dot { border-color: var(--boost); color: var(--boost); animation: pulse 1.6s ease-in-out infinite; }
.node.now button { border-color: var(--boost); }
.node.locked button { opacity: .55; cursor: default; }
.node.locked button:hover { border-color: var(--line); }
.node small { color: var(--muted); display: block; }
.node .meta { font: 600 .78rem var(--f-mono); color: var(--muted); white-space: nowrap; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--boost) 50%, transparent) } 50% { box-shadow: 0 0 0 8px transparent } }

/* quest */
.back { align-self: flex-start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.done { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.prose { display: flex; flex-direction: column; gap: 10px; max-width: 65ch; }
.prose code { font: .88em var(--f-mono); background: var(--panel2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; }
.prose pre { margin: 0; overflow-x: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: .85rem/1.5 var(--f-mono); }
.prose pre code { background: none; border: 0; padding: 0; }
.step { display: flex; align-items: center; gap: 10px; }
.step b { font: 700 .8rem var(--f-mono); width: 28px; height: 28px; border-radius: 6px; display: grid; place-content: center; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); flex-shrink: 0; }
.step.done b { background: var(--good); border-color: var(--good); color: var(--bg); }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
.opt input { margin-top: 4px; accent-color: var(--plat); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.why { font-size: .88rem; color: var(--muted); }
.result { font-family: var(--f-display); font-size: 1.1rem; }
.result.pass { color: var(--good); } .result.fail { color: var(--bad); }

/* review flip card */
.fc { perspective: 1000px; min-height: 200px; }
.fc-in { display: grid; min-height: 200px; transition: transform .5s; transform-style: preserve-3d; }
.fc.flipped .fc-in { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.face.b { transform: rotateY(180deg); border-color: var(--plat); }
.face .prose { align-items: center; }

/* history */
.hist { display: flex; flex-direction: column; gap: 6px; }
.hist div { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 10px; font-size: .88rem; padding: 6px 0; border-bottom: 1px solid var(--line); }
.hist .num { color: var(--muted); }
.hist .xp { color: var(--boost); font-weight: 700; }

.empty { border: 2px dashed var(--line); border-radius: 10px; padding: 22px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.empty b { color: var(--ink); font-family: var(--f-display); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font: 600 .9rem var(--f-body); z-index: 30; max-width: calc(100% - 32px); }

/* overlay */
.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 82%, transparent); display: grid; place-content: center; z-index: 25; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--tier, var(--line)); border-radius: 14px; padding: 28px 28px 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 360px; animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); box-shadow: 0 0 40px color-mix(in srgb, var(--tier, var(--boost)) 30%, transparent); }
.modal .hex { width: 84px; height: 84px; }
.modal p { max-width: 30ch; font-style: italic; }
.modal h2 { color: var(--tier, var(--boost)); font-size: 1.5rem; letter-spacing: .04em; text-transform: none; }
.big-award img { width: 96px; height: 96px; }
.modal .xp { font: 700 2rem var(--f-mono); color: var(--boost); }
@keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 26; }

@media (max-width: 560px) { .hud { grid-template-columns: auto 1fr; } .side { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; } .today { grid-template-columns: repeat(2, minmax(0, 1fr)); } .today .label { grid-column: 1 / -1; } h1 { font-size: 1.5rem; } .badge { width: 72px; height: 72px; } .xp-float { left: 90px; } }
.spips { display: flex; gap: 6px; flex-wrap: wrap; }
.spip { width: 34px; height: 34px; padding: 0; border-radius: 8px; font: 700 .85rem var(--f-mono); display: grid; place-content: center; }
.spip.done { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.spip.now { border-color: var(--boost); color: var(--boost); }
.spip.locked { opacity: .45; }
.spip.sel { outline: 2px solid var(--plat); outline-offset: 2px; }
.mission-card { border-color: color-mix(in srgb, var(--boost) 45%, var(--line)); }
.editor { width: 100%; box-sizing: border-box; font: .9rem/1.55 var(--f-mono); background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px; resize: vertical; tab-size: 2; }
.editor:focus { outline: 2px solid var(--plat); outline-offset: 1px; }
.results { overflow-x: auto; max-height: 360px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
.results table { border-collapse: collapse; font: .82rem var(--f-mono); font-variant-numeric: tabular-nums; width: max-content; min-width: 100%; }
.results th { position: sticky; top: 0; background: var(--panel2); text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 700; }
.results td { padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.schema { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: .88rem; }
.schema summary { cursor: pointer; font-weight: 600; }
.schema p { margin: 8px 0 0; line-height: 1.9; }
.schema code { font: .8rem var(--f-mono); background: var(--panel); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; }
.hint-box { background: var(--boost-soft); border-radius: 8px; padding: 10px 12px; font-size: .92rem; }
.hint-box code { font: .85em var(--f-mono); }
.fb { font-family: var(--f-display); font-size: 1rem; margin: 0; }
.fb.pass { color: var(--good); } .fb.fail { color: var(--bad); }
.upload { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel2); border: 1px dashed var(--line); border-radius: 8px; padding: 12px; }
.upload input { max-width: 100%; font: inherit; color: var(--ink); }
.upload p { flex-basis: 100%; }
.shelf { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; min-height: 30px; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; flex-shrink: 0; }
.px.locked { opacity: .55; }
.shelf .shelf-btn { padding: 4px 8px; font: 600 .75rem var(--f-mono); color: var(--muted); }
.trophies { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 10px; }
.trophy { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.trophy > div { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.trophy.on { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 20%, transparent); }
.trophy.off b { color: var(--muted); }
.trophy .need { font-size: .85rem; margin: 0; }
.trophy .lore { font-style: italic; font-size: .88rem; margin: 0; color: var(--ink); }
.trophy .lore.dim { color: var(--muted); font-style: normal; font-size: .8rem; }
.trophy .bar { height: 6px; }
.trophy .bar i { background: var(--gold); }
.shelf .more { font: 600 .75rem var(--f-mono); color: var(--muted); align-self: center; }
.ladder { grid-column: 1 / -1; display: flex; gap: 4px; }
.ladder i { flex: 1; height: 10px; background: var(--line); transform: skewX(-18deg); border-radius: 2px; }
.ladder i.on { background: var(--tier); box-shadow: 0 0 6px color-mix(in srgb, var(--tier) 50%, transparent); }
.skill .bench { color: var(--muted); font-size: .82rem; }
.next-rank { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; background: var(--panel2); border: 1px dashed var(--line); border-radius: 8px; padding: 10px; font-size: .85rem; }
.next-rank p { margin: 0; }
.next-rank button { align-self: flex-start; }
.trial-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.trial-bar .clock { font: 700 1.1rem var(--f-mono); }
.trial-bar .clock.low { color: var(--bad); }
.tres { display: flex; flex-direction: column; gap: 6px; }
.tres div { display: flex; gap: 10px; align-items: baseline; font-size: .9rem; }
.tres b.ok { color: var(--good); } .tres b.no { color: var(--bad); }
.board { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 16px; align-items: start; background: linear-gradient(135deg, var(--panel), var(--panel2)); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.npc { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.npc canvas { width: 84px; height: 120px; image-rendering: pixelated; image-rendering: crisp-edges; animation: bob 2.8s ease-in-out infinite; }
.npc b { font-family: var(--f-display); font-size: .9rem; }
.speech { position: relative; background: var(--panel); border: 2px solid var(--ink); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; box-shadow: 4px 4px 0 var(--line); }
.speech::before { content: ""; position: absolute; left: -12px; top: 34px; border: 6px solid transparent; border-right-color: var(--ink); border-width: 6px 12px 6px 0; }
.speech .say { font-size: 1rem; line-height: 1.55; min-height: 4.6em; margin: 0; cursor: pointer; }
.reward { background: var(--panel2); border-radius: 8px; padding: 10px 12px; }
.reward ul { margin: 4px 0 6px; padding-left: 18px; }
.reward p { margin: 0; }
.pager { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; font-size: .85rem; color: var(--muted); }
@media (max-width: 560px) { .board { grid-template-columns: minmax(0, 1fr); padding: 12px; } .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; } .pager { margin-left: 0; } .npc { flex-direction: row; justify-content: flex-start; gap: 10px; } .npc canvas { width: 56px; height: 80px; } .speech::before { display: none; } }
/* guide NPC that travels with a topic, Quest Log (main + side quests) */
.g-sprite, .me-mini, .pix-npc { image-rendering: pixelated; image-rendering: crisp-edges; }
.guide-bar { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.guide-bar .npc canvas { width: 56px; height: 80px; }
.guide-bar .npc b { font-size: .78rem; }
.guide-bar .speech { padding: 10px 14px; box-shadow: 3px 3px 0 var(--line); }

<script>
const RANKS = [[0, 'Rookie', 'bronze', 'I'], [500, 'Contender', 'silver', 'II'], [2000, 'Challenger', 'gold', 'III'], [5000, 'Champion', 'plat', 'IV'], [10000, 'Legend', 'diamond', 'V']];
const GAPS = [1, 3, 7, 14, 30, 60];
const XP = { quiz: 25, flawless: 10, quest: 50, card: 5, step: 5, project: 200, topic: 100, trial: 100 };
const CELLS = 20;
const S = { db: null, player: {}, stats: [], topics: [], cards: [], trials: [], offers: [], requests: [], board: { idx: 0 }, log: [], loaded: false, view: { name: 'home' }, quiz: {}, sbx: {}, ask: {}, sample: null };

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => ymd(new Date());
const addDays = (n, from = new Date()) => { const d = new Date(from); d.setDate(d.getDate() + n); return ymd(d); };
// A failed Rank Trial locks that level for TRIAL_WAIT days. Returns the retry date while locked, else null.
const TRIAL_WAIT = 3;
const retryOn = (st, lv) => { const f = (st?.trialFails || {})[lv]; if (!f) return null; const d = addDays(TRIAL_WAIT, new Date(f + 'T12:00:00')); return d > today() ? d : null; };
const dayName = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Short explainer text: paragraphs, `code`, ```blocks```, **bold**.
function prose(src) {
  const parts = String(src || '').split(/```(?:\w+)?\n?([\s\S]*?)```/);
  return parts.map((p, i) => i % 2 ? `<pre><code>${esc(p.trim())}</code></pre>` :
    p.split(/\n\s*\n/).filter(x => x.trim()).map(x => `<p>${esc(x.trim()).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\[\[(https:\/\/[^\]]+)\]\]/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, '<br>')}</p>`).join('')
  ).join('');
}
const hex = (txt, cls = '') => `<svg class="hex ${cls}" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,3 93,27 93,73 50,97 7,73 7,27"/><text x="50" y="52">${esc(txt)}</text></svg>`;

// ---------- game maths (mirrors references/game-rules.md) ----------
function levelOf(xp) {
  let l = 1, need = 100, left = xp || 0;
  while (left >= need) { left -= need; l++; need = 100 * l; }
  return { l, into: left, need };
}
// Mastery (1-7) is proven by Rank Trials only. XP is practice and drives the player rank.
const tierOfMastery = m => m >= 7 ? 'diamond' : m >= 6 ? 'plat' : m >= 5 ? 'gold' : m >= 3 ? 'silver' : 'bronze';
const tierOfLevel = l => l >= 10 ? 'diamond' : l >= 7 ? 'plat' : l >= 5 ? 'gold' : l >= 3 ? 'silver' : 'bronze';
function rankOf(xp) {
  let i = 0; while (i + 1 < RANKS.length && xp >= RANKS[i + 1][0]) i++;
  return { idx: i, name: RANKS[i][1], tier: RANKS[i][2], num: RANKS[i][3], from: RANKS[i][0], next: RANKS[i + 1] };
}
const dueCards = () => S.cards.filter(c => c.due && c.due <= today());
const hashStr = x => [...x].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) | 0, 7);
const mixedDue = () => dueCards().sort((a, b) => hashStr(a.id + today()) - hashStr(b.id + today()));
function sharpness(statId) {
  const overdue = S.cards.filter(c => c.stat === statId && c.due && c.due < today()).length;
  return Math.max(50, 100 - 10 * overdue);
}
const passMark = n => Math.ceil(n * 2 / 3);
const unlocked = (t, i) => i === 0 || !!(t.quests[i - 1] || {}).completedOn;
// Offered topics wait on the Quest Board. Accepted ones run side by side: one main quest, the rest side quests.
const isActive = t => !t.status || t.status === 'active';
function questLine() {
  const act = S.topics.filter(isActive), main = act.find(t => t.id === S.player.activeTopic) || act[0];
  return [main, ...act.filter(t => t !== main)].filter(Boolean)
    .map(t => ({ topic: t, quest: (t.quests || []).find(q => !q.completedOn), main: t === main })).filter(x => x.quest);
}
const nextQuest = () => questLine()[0] || null;
const untouched = t => !(t.quests || []).some(q => q.completedOn || (q.stepsDone || 0) > 0 || q.taskDone || (q.quizBest || 0) > 0);
function todayRun() {
  const p = S.player, t = today();
  const cards = p.cardsOn === t ? (p.cardsToday || 0) : 0;
  const quests = S.topics.reduce((n, tp) => n + (tp.quests || []).filter(q => q.completedOn === t).length, 0);
  return { cards, quests, counted: p.lastActiveOn === t };
}

// ---------- feedback: toast, float, sound, confetti, overlays ----------
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function floatXp(xp) {
  const f = document.createElement('span'); f.className = 'xp-float'; f.textContent = `+${xp} XP`;
  $('#hud').appendChild(f); setTimeout(() => f.remove(), 1300);
}
const sfx = (() => {
  let ctx; const muted = () => { try { return localStorage.getItem('st-mute') === '1'; } catch { return false; } };
  function tone(f, d, type = 'square', g = .04) {
    if (muted()) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), v = ctx.createGain();
      o.type = type; o.frequency.value = f; v.gain.value = g;
      o.connect(v); v.connect(ctx.destination); o.start();
      v.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + d); o.stop(ctx.currentTime + d);
    } catch (e) { /* no audio here */ }
  }
  const seq = (fs, d, step, type) => fs.forEach((f, i) => setTimeout(() => tone(f, d, type), i * step));
  return { muted,
    flip: () => tone(520, .08, 'sine'), card: () => tone(740, .1, 'sine'),
    pass: () => seq([660, 880], .12, 90), fail: () => tone(180, .25, 'sawtooth', .025),
    clear: () => seq([523, 659, 784, 1046], .18, 90, 'triangle'), level: () => seq([392, 523, 659, 784, 1046], .22, 100, 'triangle'),
    toggle: () => { try { localStorage.setItem('st-mute', muted() ? '0' : '1'); } catch (e) { /* ignore */ } } };
})();
function confetti() {
  if (reduced()) return;
  const c = $('#fx'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight; c.hidden = false;
  const cols = ['#ff7a1a', '#3ddc84', '#5fe3d0', '#f2c14e', '#a98bff'];
  const ps = Array.from({ length: 120 }, () => ({ x: c.width / 2, y: c.height / 2, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 3, a: Math.random() * 6, col: cols[Math.random() * cols.length | 0] }));
  const t0 = performance.now();
  (function frame(t) {
    const k = (t - t0) / 1400; ctx.clearRect(0, 0, c.width, c.height);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.vy += .35; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = Math.max(0, 1 - k); ctx.fillStyle = p.col; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); }
    if (k < 1) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })(t0);
}
const ovQ = []; let ovOpen = false;
function celebrate(o) { ovQ.push(o); if (!ovOpen) nextOverlay(); }
function nextOverlay() {
  const o = ovQ.shift(); if (!o) { ovOpen = false; return; }
  ovOpen = true;
  const el = document.createElement('div'); el.className = 'overlay'; el.setAttribute('role', 'dialog');
  const then = o.then;
  el.innerHTML = `<div class="modal t-${o.tier || 'bronze'}">${o.art ? `<div class="big-award">${o.art}</div>` : o.badge ? hex(o.badge) : ''}<span class="label">${esc(o.kicker)}</span><h2>${esc(o.title)}</h2>${o.sub ? `<p>${esc(o.sub)}</p>` : ''}${o.xp ? `<span class="xp">+${o.xp} XP</span>` : ''}<button class="go" id="ov-ok">${esc(o.ok || 'Nice')}</button></div>`;
  document.body.appendChild(el);
  (o.sound || sfx.clear)(); if (o.confetti) confetti();
  const close = () => { el.remove(); nextOverlay(); if (then) then(); };
  $('#ov-ok', el).onclick = close; el.onclick = e => { if (e.target === el) close(); };
  $('#ov-ok', el).focus();
}

// ---------- writes (one at a time per doc) ----------
async function write(path, data, create) {
  if (!S.db) { toast('Progress can\'t be saved here. Open the page signed in.'); throw new Error('no db'); }
  const ref = S.db.doc(path);
  return create ? ref.set(data) : ref.update(data);
}
async function logEvent(type, topic, xp, note) {
  const ref = S.db.doc('log/' + today().slice(0, 7));
  const snap = await ref.get();
  const entries = snap.exists ? [...(snap.data().entries || [])] : [];
  entries.push({ on: today(), type, topic: topic || null, xp, note: note || '' });
  await ref.set({ entries });
}
// Returns level-up / rank-up info so the caller can show it after its own overlay.
async function award(statId, xp, type, topicId, note) {
  const out = { levelUp: null, rankUp: null };
  const st = S.stats.find(s => s.id === statId);
  if (st) { st.xp = (st.xp || 0) + xp; await write('stats/' + statId, { xp: st.xp }); }
  const p = S.player, before = rankOf(p.xp || 0).idx, nxp = (p.xp || 0) + xp;
  await write('player/me', { ...(p.exists ? {} : { streak: 0, bestStreak: 0 }), xp: nxp }, !p.exists);
  p.xp = nxp; p.exists = true;
  const r = rankOf(nxp); if (r.idx > before) out.rankUp = r;
  await logEvent(type, topicId, xp, note);
  floatXp(xp);
  return out;
}
function showUps(up) {
  if (up.levelUp) celebrate({ kicker: 'Level up', title: `${up.levelUp.stat} L${up.levelUp.l}`, badge: 'L' + up.levelUp.l, tier: tierOfLevel(up.levelUp.l), sound: sfx.level, confetti: true, ok: 'Keep going' });
  if (up.rankUp) celebrate({ kicker: 'Rank up', title: up.rankUp.name, sub: `${up.rankUp.from.toLocaleString('en-GB')} XP. New badge unlocked.`, badge: up.rankUp.num, tier: up.rankUp.tier, sound: sfx.level, confetti: true, ok: 'Let\'s go' });
}
// A day counts after a quest or 3+ review cards. One rest day per 7.
async function markActive(kind) {
  const p = S.player, t = today();
  const cardsToday = p.cardsOn === t ? (p.cardsToday || 0) : 0;
  const patch = {};
  if (kind === 'card') { patch.cardsOn = t; patch.cardsToday = cardsToday + 1; }
  const counts = kind === 'quest' || (kind === 'card' && cardsToday + 1 >= 3);
  let dayCounted = false;
  if (counts && p.lastActiveOn !== t) {
    let streak = 1;
    if (p.lastActiveOn === addDays(-1)) streak = (p.streak || 0) + 1;
    else if (p.lastActiveOn === addDays(-2) && (!p.restUsedOn || p.restUsedOn < addDays(-7))) { streak = (p.streak || 0) + 1; patch.restUsedOn = addDays(-1); }
    Object.assign(patch, { streak, lastActiveOn: t, bestStreak: Math.max(streak, p.bestStreak || 0) });
    dayCounted = true;
  }
  if (Object.keys(patch).length) { await write('player/me', patch, !p.exists); Object.assign(p, patch, { exists: true }); }
  return dayCounted;
}

// ---------- pixel character: made in the creator, gains gear as rank rises ----------
// 14 x 20 grid. buildSprite(look) gives the body; gear letters come from rank: c crown, r headband (tier), k cape (tier, drawn behind the body).
// Body letters: h hair, H light hair, s skin, e eye, o outfit, d outfit shade, w white, p trousers, b boots, g glasses, a/A headphones.
const LOOKS = {
  hair: ['Short', 'Afro', 'Long', 'Bun', 'Spiky', 'Buzz', 'Headscarf'],
  hairColor: ['#1a1210', '#4a2e1c', '#8a5a2b', '#d9b26a', '#b8422e', '#c9c9d1', '#5b6cff'],
  skin: ['#f5d3b3', '#e8b98f', '#c68a5e', '#a26a42', '#8d5a3b', '#5c3a24'],
  outfit: ['Jersey', 'Hoodie', 'Shirt & tie', 'Lab coat'],
  outfitColor: ['#c8103e', '#2f6fde', '#1f9d55', '#f2c14e', '#7a4ff0', '#222831', '#ff7a1a'],
  extra: ['None', 'Glasses', 'Cap', 'Headphones'],
};
const LOOK_LABELS = { hair: 'Hair', hairColor: 'Hair colour', skin: 'Skin', outfit: 'Outfit', outfitColor: 'Outfit colour', extra: 'Extra' };
const DEFAULT_LOOK = { hair: 'Short', hairColor: '#1a1210', skin: '#c68a5e', outfit: 'Hoodie', outfitColor: '#2f6fde', extra: 'None' };
function cleanLook(l) { const o = {}; for (const k of Object.keys(LOOKS)) o[k] = LOOKS[k].includes(l?.[k]) ? l[k] : DEFAULT_LOOK[k]; return o; }
function buildSprite(look) {
  const L = cleanLook(look), G = Array.from({ length: 20 }, () => new Array(14).fill('.'));
  const p = (x, y, ch) => { if (x >= 0 && x < 14 && y >= 0 && y < 20) G[y][x] = ch; };
  const R = (x0, x1, y0, y1, ch) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) p(x, y, ch); };
  const h = L.hair, f = L.outfit, afro = h === 'Afro';
  R(4, 9, 4, 8, 's'); R(5, 8, 9, 9, 's');
  if (afro) { R(4, 9, 1, 1, 'h'); R(3, 10, 2, 2, 'h'); R(2, 11, 3, 4, 'h'); R(2, 3, 5, 6, 'h'); R(10, 11, 5, 6, 'h'); p(3, 7, 'h'); p(10, 7, 'h'); }
  if (h === 'Short' || h === 'Long' || h === 'Bun') { R(4, 9, 2, 2, 'h'); R(3, 10, 3, 3, 'h'); p(3, 4, 'h'); p(10, 4, 'h'); }
  if (h === 'Long') { R(3, 3, 4, 11, 'h'); R(10, 10, 4, 11, 'h'); }
  if (h === 'Bun') R(6, 7, 0, 1, 'h');

// Ready for a Rank Trial: the next level's trial exists and every quest it covers (topic placement maps) is cleared.
function trialReady() {
  return S.stats.map(st => {
    const lv = (st.mastery || 0) + 1, trial = S.trials.find(x => x.stat === st.id && x.level === lv);

}

function topicLine(t) {
  const g = guideOf(t); if (!g) return '';
  const qs = t.quests || [], done = qs.filter(q => q.completedOn).length, next = qs.find(q => !q.completedOn);
  if (!next) return g.lines.done;
  if (!done && !(qs[0]?.stepsDone)) return g.lines.hello;
  return `${pickLine(g.lines.back, done)} Next up: ${next.boss ? 'the boss fight, ' : ''}"${next.title}". About ${next.minutes || 15} min.`;
}
// Course length from the quest estimates: full, and what's left (part-done quests count their steps left).
const fmtMin = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h${r ? ` ${r}m` : ''}` : `${r} min`; };
function topicTime(t) {
  const qs = t.quests || [];
  const full = qs.reduce((a, q) => a + (q.minutes || 15), 0);
  const left = qs.filter(q => !q.completedOn).reduce((a, q) => {
    const n = q.steps?.length || 0, d = Math.min(q.stepsDone || 0, n);
    return a + (q.minutes || 15) * (n ? (n - d) / n : 1);
  }, 0);
  const n = qs.filter(q => !q.completedOn).length;
  return `<p class="why"><b>Full course:</b> ${fmtMin(full)} over ${qs.length} quests · <b>Left:</b> ${n ? `${fmtMin(left)} (${n} quest${n > 1 ? 's' : ''})` : 'none, all cleared'}. Times are estimates for a beginner.</p>`;
}

function quizCard(q) {

  }).join('');

}

// Guided quest: one step at a time, run SQL in the page, auto-checked.
function stepQuestView(t, q) {
  const steps = q.steps, done = q.stepsDone || 0, allDone = done >= steps.length;
  const idx = Math.min(S.view.step ?? done, steps.length);
  const s = steps[idx], sb = t.sandbox || {};
  const pips = steps.map((x, i) => {
    const cls = i < done ? 'done' : i === done ? 'now' : 'locked';
    return `<button class="spip ${cls}${i === idx ? ' sel' : ''}" ${i <= done ? `data-step="${i}"` : 'disabled'} aria-label="Step ${i + 1}${i < done ? ', cleared' : ''}">${i < done ? '✓' : i + 1}</button>`;
  }).join('') + `<button class="spip ${allDone ? (q.completedOn ? 'done' : 'now') : 'locked'}${idx === steps.length ? ' sel' : ''}" ${allDone ? `data-step="${steps.length}"` : 'disabled'} aria-label="Quiz">?</button>`;
  const [gl, mood] = stepLine(t, q, idx, s);
  const head = `<button class="back ghost" id="b-topic">← ${esc(t.title)}</button>
    <div><span class="label">${q.boss ? 'Boss fight · ' : q.mixed ? 'Mixed practice · no labels · ' : ''}${esc(t.title)}</span><h1 style="font-size:1.5rem">${esc(q.title)}</h1></div>
    <div class="spips" role="navigation" aria-label="Steps">${pips}${(S.combo || 0) >= 2 ? `<span class="chip combo num" title="Steps cleared first time in a row">Combo x${S.combo}</span>` : ''}</div>
    ${guideBar(t, gl, mood)}`;
  if (!s) return head + quizCard(q) + (q.completedOn ? '' : '');
  const cleared = idx < done;
  // Branch before touching s.hints: do-steps (desktop tools) have none, or those quests wouldn't open.
  if (s.kind === 'do') return head + doStepCard(t, q, s, idx, cleared);
  if (s.kind === 'input') return head + inputStepCard(t, q, s, idx, cleared);
  const sx = S.sbx, hintsShown = sx.hints || 0, canReveal = sx.fails >= 2 || hintsShown >= (s.hints || []).length;
  return `${head}
    <div class="card"><div class="step ${cleared ? 'done' : ''}"><b>${cleared ? '✓' : idx + 1}</b><h3>${esc(s.title)}</h3><span class="meta num why" style="margin-left:auto">Step ${idx + 1} of ${steps.length}</span></div>
      <div class="prose">${prose(s.teach)}</div>${s.example ? `<span class="label">Example</span><div class="prose">${prose(s.example)}</div>` : ''}</div>
    ${lessonExtras(t, q, s)}
    <div class="card mission-card"><span class="label">Your mission</span><div class="prose">${prose(s.goal)}</div>
      ${s.rows && !s.contains && !s.verify && !s.matchSql ? `<p class="why">The right answer has <b class="num">${s.rows}</b> row${s.rows > 1 ? 's' : ''}.</p>` : ''}
      ${s.upload ? `<div class="upload"><label class="label" for="csv">Your CSV file</label><input type="file" id="csv" accept=".csv,text/csv">${sb.rawSample ? '<button id="b-sample" class="ghost">Use the sample file</button>' : ''}${SQLX.upload ? `<p class="why">Loaded <b>${esc(SQLX.upload.name)}</b>: <span class="num">${SQLX.upload.rows.length}</span> rows, <span class="num">${SQLX.upload.columns.length}</span> columns into <code>raw_results</code>.</p>` : ''}</div>` : ''}
      ${schemaHtml(sb)}
      <label class="label" for="sql">Your SQL <span style="text-transform:none;letter-spacing:0">(Ctrl + Enter runs it)</span></label>
      <textarea id="sql" class="editor" spellcheck="false" autocapitalize="off" autocomplete="off" rows="${Math.max(5, (sx.draft || '').split('\n').length + 1)}">${esc(sx.draft)}</textarea>
      <div class="acts"><button class="go" id="b-run" ${sx.loading ? 'disabled' : ''}>${sx.loading ? 'Loading data…' : 'Run'}</button>
        ${hintsShown < s.hints.length ? `<button id="b-hint">Hint (${s.hints.length - hintsShown} left)</button>` : ''}
        <button id="b-reveal" ${canReveal ? '' : 'disabled title="Unlocks after 2 tries or both hints"'}>Show answer</button>
        ${s.starter ? '<button class="ghost" id="b-resetcode">Reset code</button>' : ''}
        ${cleared || sx.passed ? `<button class="go" id="b-next">${idx + 1 < steps.length ? 'Next step →' : 'On to the quiz →'}</button>` : ''}</div>
      ${s.hints.slice(0, hintsShown).map((h, i) => `<p class="hint-box"><b>Hint ${i + 1}:</b> ${prose(h).replace(/^<p>|<\/p>$/g, '')}</p>`).join('')}
      ${sx.feedback ? `<p class="fb ${sx.feedback.ok ? 'pass' : 'fail'}">${esc(sx.feedback.msg)}</p>` : ''}
      <div id="out">${sx.out || ''}</div></div>`;
}

// What the guide says on a step: reacts to a pass or fail, otherwise a tip for where you are.
function stepLine(t, q, idx, s) {
  const g = guideOf(t); if (!g) return ['', ''];

// ---------- SQL sandbox (sql.js, pure JS build) ----------
const SQLX = { SQL: null, data: {}, schema: {}, ans: {}, expected: {}, samples: {} };
function loadScript(src) {
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('script')); document.head.appendChild(s); });
}
async function sqlEngine() {
  if (SQLX.SQL) return SQLX.SQL;
  if (!window.initSqlJs) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-asm.js');
  SQLX.SQL = await window.initSqlJs();
  return SQLX.SQL;
}
async function dataset(path) {
  if (!SQLX.data[path]) {
    const r = await fetch(path); if (!r.ok) throw new Error('data');
    SQLX.data[path] = await r.json(); SQLX.schema[path] = SQLX.data[path].columns;
  }
  return SQLX.data[path];
}
async function freshDb(sb) {
  const SQL = await sqlEngine(), d = await dataset(sb.dataset), db = new SQL.Database();
  db.run(`CREATE TABLE ${d.table} (${d.columns.map(c => c === 'id' ? 'id INTEGER PRIMARY KEY' : c).join(', ')})`);
  const ins = db.prepare(`INSERT INTO ${d.table} VALUES (${d.columns.map(() => '?').join(',')})`);
  db.run('BEGIN'); for (const row of d.rows) ins.run(row); db.run('COMMIT'); ins.free();
  if (sb.setup) db.exec(sb.setup);
  if (SQLX.upload) loadRaw(db);

}
const lastResult = res => res.length ? res[res.length - 1] : null;
const norm = v => v === null || v === undefined ? '∅' : typeof v === 'number' ? String(Math.round(v * 1e4) / 1e4) : String(v);
// Passes if the learner's result holds the answer's columns (any names, any column order, extras allowed) with the same rows.
function compare(user, exp, ordered) {
  if (!user) return { ok: false, msg: 'That ran but returned no rows. The answer has rows, so check your WHERE.' };
  if (user.values.length !== exp.values.length) {
    const more = user.values.length > exp.values.length;
    return { ok: false, msg: `You got ${user.values.length} row${user.values.length === 1 ? '' : 's'}, the answer has ${exp.values.length}. ${more ? 'Too many: check your WHERE, brackets or LIMIT.' : 'Too few: check your WHERE isn\'t too strict, or your LIMIT.'}` };
  }
  const colVec = (r, j) => r.values.map(row => norm(row[j]));
  const key = (arr, ord) => (ord ? arr : arr.slice().sort()).join('\u0001');
  const used = new Set(), map = [];
  for (let j = 0; j < exp.columns.length; j++) {
    const want = key(colVec(exp, j), ordered);
    const k = user.columns.findIndex((_, i) => !used.has(i) && key(colVec(user, i), ordered) === want);
    if (k < 0) return { ok: false, msg: `Right number of rows, but the "${exp.columns[j]}" column is missing or its values are off. Check the column list and any maths.` };
    used.add(k); map.push(k);
  }
  const tuples = r => r.values.map(row => map.map(k => norm(row[k])).join('\u0002'));
  const eTuples = exp.values.map(row => exp.columns.map((_, j) => norm(row[j])).join('\u0002'));
  if (key(tuples(user), ordered) !== key(eTuples, ordered)) return { ok: false, msg: ordered ? 'Right values, wrong order. Check your ORDER BY.' : 'The columns are right but the rows don\'t line up. Check your WHERE and GROUP BY.' };
  return { ok: true, msg: user.columns.length > exp.columns.length ? 'Correct. (You have extra columns, which is fine.)' : 'Correct.' };
}
function tableHtml(r) {
  if (!r) return '<p class="why">Ran OK. No rows returned.</p>';
  const shown = r.values.slice(0, 50);
  return `<div class="results"><table><thead><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${shown.map(row => `<tr>${row.map(v => `<td>${v === null ? '<i>null</i>' : esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="why num">${r.values.length} row${r.values.length === 1 ? '' : 's'}${r.values.length > 50 ? ', first 50 shown' : ''}</p>`;
}
function friendlyError(msg, cols) {
  const m = String(msg);
  if (/no such column: (\S+)/.test(m)) return `There's no column called ${RegExp.$1}. Check the spelling (use underscores, all lower case). Open "Tables you can use" to see the names.`;
  if (/no such table: (\S+)/.test(m)) return `There's no table called ${RegExp.$1} yet. Check the spelling. If an earlier step makes it, go back one step and press Run there, then come back.`;
  if (/near "(.*?)": syntax error/.test(m)) return `SQL got confused near "${RegExp.$1}". Check for a missing comma, a missing quote, or a keyword in the wrong order.`;
  if (/near ";"|VALUES/.test(m) && /syntax error/.test(m)) return 'Check your rows: each one in (brackets), a comma between rows, and a ; only after the last row.';
  if (/incomplete input/.test(m)) return 'The query stops halfway. Check every bracket and quote is closed, and the CASE has an END.';
  if (/(table|index) (\S+) already exists/.test(m)) return `${RegExp.$2} is already there: you made it on an earlier run in this quest. To start it again, put DROP ${RegExp.$1.toUpperCase()} IF EXISTS ${RegExp.$2}; on the first line.`;
  if (/misuse of aggregate/.test(m)) return 'An aggregate (SUM, COUNT, AVG) is in the wrong place. Filters on them go in HAVING, not WHERE.';
  return m;
}
const draftKey = (t, q, s) => `st-draft:${t.id}:${q.id}:${s.id}`;
function getDraft(t, q, s) { try { return localStorage.getItem(draftKey(t, q, s)); } catch { return null; } }
function setDraft(t, q, s, v) { try { localStorage.setItem(draftKey(t, q, s), v); } catch (e) { /* ignore */ } }

// CSV upload: parse, keep in memory, load as raw_results (all text, like a real import).
function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some(x => x !== '')) rows.push(row); row = []; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); if (row.some(x => x !== '')) rows.push(row); }
  const columns = rows.shift() || [];
  return { columns, rows: rows.map(r => columns.map((_, i) => r[i] ?? '')) };
}
// The topic's own sample CSV (sandbox.rawSample, published with the page). build_pack.py loads the same file into raw_results.
async function sampleCsv(sb) {
  const path = sb?.rawSample; if (!path) throw new Error('no sample');
  if (!SQLX.samples[path]) { const r = await fetch(path); if (!r.ok) throw new Error('data'); SQLX.samples[path] = parseCsv(await r.text()); }
  return SQLX.samples[path];
}
const sampleName = sb => 'sample ' + String(sb?.rawSample || '').split('/').pop();
function loadRaw(db) {
  const u = SQLX.upload, qi = c => '"' + String(c).replace(/"/g, '""') + '"';
  db.run('DROP TABLE IF EXISTS raw_results');
  db.run(`CREATE TABLE raw_results (${u.columns.map(qi).join(', ')})`);
  const ins = db.prepare(`INSERT INTO raw_results VALUES (${u.columns.map(() => '?').join(',')})`);
  db.run('BEGIN'); for (const r of u.rows) ins.run(r); db.run('COMMIT'); ins.free();
}
function useUpload(name, parsed, raw) {
  if (!parsed.columns.length || !parsed.rows.length) { S.sbx.feedback = { ok: false, msg: 'That file looks empty. Pick the CSV the lesson linked.' }; render(); return; }
  SQLX.upload = { name, ...parsed };
  if (raw && raw.length < 3e6) { try { localStorage.setItem('st-upload', JSON.stringify({ name, text: raw })); } catch (e) { /* storage full or blocked */ } }
  if (S.sbx.db) loadRaw(S.sbx.db);
  sfx.card();
  S.sbx.feedback = { ok: true, msg: `Loaded ${parsed.rows.length} rows into raw_results. Now press Run.` };
  render();
}

// Rebuild tables from earlier steps of a keepDb quest (after a reload or a new visit), using the SQL that passed.
function replaySteps(t, q, idx, db) {
  for (let i = 0; i < Math.min(idx, q.stepsDone || 0); i++) {
    const st = q.steps[i];
    const smp = SQLX.samples[t.sandbox?.rawSample];
    if (st.upload && !SQLX.upload && smp) { SQLX.upload = { name: sampleName(t.sandbox), ...smp }; loadRaw(db); }
    const sql = (q.solved || {})[st.id] || st.answer;
    if (!sql) continue;
    for (const stmt of sql.split(';').map(x => x.trim()).filter(Boolean)) {
      if (/^select|^with|^explain/i.test(stmt)) continue;
      try { db.exec(stmt); } catch (e) { /* already there or not needed */ }
    }
  }
}
function restoreUpload() {
  try {
    const saved = JSON.parse(localStorage.getItem('st-upload') || 'null');
    if (saved && saved.text) { const parsed = parseCsv(saved.text); if (parsed.columns.length && parsed.rows.length) SQLX.upload = { name: saved.name, ...parsed }; }
  } catch (e) { /* no saved upload */ }

// Load a fresh database for the step being shown (so indexes and mistakes never leak between steps).
async function prepareStep(t, q) {
  const idx = Math.min(S.view.step ?? (q.stepsDone || 0), q.steps.length), s = q.steps[idx];
  const key = `${t.id}:${q.id}:${idx}`;
  if (S.sbx.key === key) return;
  S.sbx = { key, draft: s ? (getDraft(t, q, s) ?? s.starter ?? '') : '', fails: 0, hints: 0, out: '', feedback: null, loading: !!s, passed: false };
  if (!s) return;
  if (s.kind === 'do' || s.kind === 'input') { S.sbx.loading = false; return; }
  const dbKey = q.keepDb ? `${t.id}:${q.id}` : key;
  try {
    if (!t.sandbox) throw new Error('This step needs a practice sandbox the topic doesn\'t have.');
    if (!SQLX.user || SQLX.user.key !== dbKey) {
      if (!SQLX.upload) restoreUpload();
      // Replaying a past upload step with no saved upload: use the topic's sample, like build_pack does.
      if (!SQLX.upload && q.keepDb && t.sandbox.rawSample && q.steps.slice(0, idx).some(x => x.upload)) { try { await sampleCsv(t.sandbox); } catch (e) { /* replay skips it */ } }
      const db = await freshDb(t.sandbox);
      if (S.sbx.key !== key) { db.close(); return; }
      if (SQLX.user) SQLX.user.db.close();
      SQLX.user = { key: dbKey, db };
      if (q.keepDb) replaySteps(t, q, idx, db);
    }
    S.sbx.db = SQLX.user.db; S.sbx.loading = false;
    if (!s.contains && !s.verify && !s.matchSql && !SQLX.expected[key]) {
      SQLX.ans[t.id] = SQLX.ans[t.id] || await freshDb(t.sandbox);
      SQLX.expected[key] = lastResult(SQLX.ans[t.id].exec(s.answer));
    }
  } catch (e) {
    console.error(e); S.sbx.loading = false;
    S.sbx.feedback = { ok: false, msg: 'Couldn\'t load the practice data. Check your connection and reopen the quest.' };
  }
  if (S.view.name === 'quest') render();
}

function bindSteps(t, q) {
  document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { S.view.step = Number(b.dataset.step); S.quiz = {}; render(); });
  const idx = Math.min(S.view.step ?? (q.stepsDone || 0), q.steps.length), s = q.steps[idx];
  const key = `${t.id}:${q.id}:${idx}`;
  if (S.sbx.key !== key) { prepareStep(t, q); render(); return; }
  if (!s) return;
  bindAsk(t, q, s);
  if (s.kind === 'do') { bindDo(t, q, s, idx); return; }
  if (s.kind === 'input') { bindInput(t, q, s, idx); return; }
  const ed = $('#sql');
  if (ed) {
    ed.oninput = () => { S.sbx.draft = ed.value; setDraft(t, q, s, ed.value); };
    ed.onkeydown = e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runStep(t, q, idx); }
      if (e.key === 'Tab') { e.preventDefault(); const p = ed.selectionStart; ed.setRangeText('  ', p, ed.selectionEnd, 'end'); S.sbx.draft = ed.value; }
    };
  }
  const on = (id, fn) => { const b = $('#' + id); if (b) b.onclick = fn; };
  on('b-run', () => runStep(t, q, idx));
  const file = $('#csv');
  if (file) file.onchange = () => { const f = file.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => useUpload(f.name, parseCsv(String(rd.result)), String(rd.result)); rd.readAsText(f); };
  on('b-sample', () => sampleCsv(t.sandbox).then(d => useUpload(sampleName(t.sandbox), d)).catch(e => { console.error(e); S.sbx.feedback = { ok: false, msg: 'Couldn\'t load the sample file. Check your connection and try again.' }; render(); }));
  on('b-hint', () => { S.sbx.hints++; sfx.flip(); render(); });
  on('b-resetcode', () => { S.sbx.draft = s.starter || ''; setDraft(t, q, s, S.sbx.draft); S.sbx.feedback = null; render(); });
  on('b-reveal', () => { S.sbx.draft = s.answer.replace(/ (FROM|WHERE|GROUP BY|HAVING|ORDER BY|LIMIT|UNION ALL|UNION|JOIN|ON|AND|WITH|SELECT|EXPLAIN|CREATE)\b/g, '\n$1').replace(/^\n/, ''); S.sbx.revealed = true; S.sbx.feedback = { ok: false, msg: 'Here\'s the answer. Read it line by line, then Run it. Steps cleared with the answer shown don\'t earn step XP.' }; render(); });
  on('b-next', () => { S.view.step = idx + 1; S.quiz = {}; render(); window.scrollTo(0, 0); });
}

function runStep(t, q, idx) {
  const s = q.steps[idx], sx = S.sbx, ed = $('#sql');
  if (!sx.db || sx.loading) return;
  const sql = (ed ? ed.value : sx.draft).trim(); sx.draft = sql;
  if (!sql) { sx.feedback = { ok: false, msg: 'Type a query first.' }; render(); return; }
  let res;
  try { res = sx.db.exec(sql); } catch (e) {
    if (/already exists/.test(e.message) && s.verify) {
      let ok = false; try { ok = Number(lastResult(sx.db.exec(s.verify))?.values[0][0]) === 1; } catch (err) { ok = false; }
      if (ok) { sx.out = ''; sx.feedback = { ok: true, msg: 'Your table is already there from your last run, and it is correct. Press Next step.' }; if (idx < (q.stepsDone || 0) || sx.passed) { sfx.pass(); render(); return; } clearStep(t, q, idx); return; }
    }
    sx.fails++; sx.out = ''; sx.feedback = { ok: false, msg: friendlyError(e.message) }; sfx.fail(); render(); return;
  }
  const r = lastResult(res); sx.out = tableHtml(r);
  let verdict;
  try {
    if (s.contains) verdict = r && r.values.some(row => row.some(v => String(v).includes(s.contains)))
      ? { ok: true, msg: `Correct. The plan says ${s.contains}.` } : { ok: false, msg: `Ran, but the result doesn't mention ${s.contains} yet.` };
    else if (s.verify) { const v = lastResult(sx.db.exec(s.verify)); verdict = v && Number(v.values[0][0]) === 1 ? { ok: true, msg: 'Correct.' } : { ok: false, msg: 'Ran, but it doesn\'t do the mission yet. Check every column and value against the mission.' }; }
    else if (s.matchSql) verdict = compare(r, lastResult(sx.db.exec(s.matchSql)), s.ordered);
    else verdict = compare(r, SQLX.expected[sx.key], s.ordered);
  } catch (e) { verdict = { ok: false, msg: /raw_results/.test(String(e.message)) ? 'Load your CSV first (or use the sample file).' : friendlyError(e.message) }; }
  sx.feedback = verdict;
  if (!verdict.ok) { sx.fails++; sfx.fail(); render(); return; }
  clearStep(t, q, idx, { solved: { ...(q.solved || {}), [s.id]: sql } });
}

function clearStep(t, q, idx, extra) {
  const s = q.steps[idx], sx = S.sbx;
  sx.passed = true;
  const fresh = idx === (q.stepsDone || 0);
  if (!fresh) { sfx.pass(); render(); return; }
  // Combo: steps cleared first time in a row (no fails, hints or shown answer). Bragging rights only, no XP.
  S.combo = !sx.fails && !sx.hints && !sx.revealed ? (S.combo || 0) + 1 : 0;
  guarded(async () => {
    if (S.combo > (S.player.bestCombo || 0)) { await write('player/me', { bestCombo: S.combo }, !S.player.exists); S.player.bestCombo = S.combo; S.player.exists = true; }
    const stepsDone = idx + 1, all = stepsDone >= q.steps.length;
    const evidence = { ...(q.evidence || {}), [s.id]: { fails: sx.fails || 0, hints: sx.hints || 0, revealed: !!sx.revealed, on: today() } };
    await applyQuest(t, q, { ...(extra || {}), evidence, stepsDone, ...(all ? { taskDone: true } : {}) }, true);
    if (!sx.revealed) { const up = await award(q.stat || t.stat, XP.step, 'step', t.id, s.title); showUps(up); }
    sfx.pass();
    toast(all ? `All steps cleared${sx.revealed ? '' : ` +${XP.step} XP`}. Quiz unlocked.` : `Step cleared${sx.revealed ? '' : ` +${XP.step} XP`}`);
    render();
  });
}

function bindDo(t, q, s, idx) {
  const sx = S.sbx, on = (id, fn) => { const b = $('#' + id); if (b) b.onclick = fn; };
  document.querySelectorAll('input[name="chk"]').forEach(r => r.onchange = () => { sx.chk = Number(r.value); sx.feedback = null; });
  const repo = $('#repo'); if (repo) repo.oninput = () => { sx.repo = repo.value.trim(); };
  on('b-next', () => { S.view.step = idx + 1; S.quiz = {}; render(); window.scrollTo(0, 0); });
  on('b-zip', () => downloadProject(t));
  on('b-check', () => {
    if (sx.chk === undefined) { sx.feedback = { ok: false, msg: 'Pick an answer first.' }; render(); return; }
    if (sx.chk !== s.check.answer) { sx.fails = (sx.fails || 0) + 1; sx.feedback = { ok: false, msg: 'Not quite. Read the step again and have another go.' }; sfx.fail(); render(); return; }
    if (s.action === 'repoUrl') {
      const url = (sx.repo || t.repoUrl || '').replace(/\/$/, '');
      if (!/^https:\/\/github\.com\/[\w.-]+\/[\w.-]+$/.test(url)) { sx.feedback = { ok: false, msg: `Right answer, but paste your repo link first. It looks like https://github.com/your-name/${shipSlug(t)}` }; render(); return; }
      guarded(() => write('topics/' + t.id, { repoUrl: url })).then(() => { sx.feedback = { ok: true, msg: `Correct. ${s.check.why}` }; clearStep(t, q, idx); });
      return;
    }
    sx.feedback = { ok: true, msg: `Correct. ${s.check.why}` };
    clearStep(t, q, idx);
  });
}

// ---------- ship: pack the boss-fight queries into a repo-ready zip ----------
// Optional per-round titles and questions for the report. Empty: each boss step's title and mission are used.
const SHIP_ROUNDS = [];
// Folder, zip and repo name from the topic id, e.g. "sql-basics" -> sql-basics-project.
const shipSlug = t => `${String(t?.id || t?.title || 'my').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'my'}-project`;
const mdTable = r => !r ? '_No rows._' : [`| ${r.columns.join(' | ')} |`, `|${r.columns.map(() => ' --- ').join('|')}|`, ...r.values.map(v => `| ${v.map(x => x === null ? '' : String(x)).join(' | ')} |`)].join('\n');
function bossQueries(t) {
  const boss = (t.quests || []).find(x => x.boss);
  if (!boss) return [];
  return boss.steps.map((st, i) => ({ title: SHIP_ROUNDS[i]?.[0] || st.title, question: SHIP_ROUNDS[i]?.[1] || st.goal, sql: (boss.solved || {})[st.id] || getDraft(t, boss, st) || st.answer }));
}
async function downloadProject(t) {
  const sx = S.sbx; if (sx.zipping) return;
  sx.zipping = true; sx.zipped = ''; render();
  try {
    const dl = await window.claude?.use?.('downloads');
    if (!dl) throw { code: 'unavailable' };
    if (!window.JSZip) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const db = await freshDb({ ...t.sandbox }), ship = (t.quests || []).find(x => x.ship) || {}, files = ship.shipFiles || {};
    const qs = bossQueries(t), name = t.project || t.title, slug = shipSlug(t);
    const src = (t.sources || []).length ? t.sources : t.sourceUrl ? [{ title: t.sourceTitle || t.sourceUrl, url: t.sourceUrl }] : [];
    const pretty = sql => sql.trim().replace(/;?\s*$/, ';');
    const report = [`-- ${name}`, '-- Runs against data.db (SQLite). Open it in DB Browser for SQLite, then Execute SQL.', ...(t.dataSource ? [`-- Data: ${t.dataSource}`] : []), '',
      ...qs.flatMap((x, i) => [`-- ${i + 1}. ${x.title}: ${String(x.question || '').replace(/\s+/g, ' ')}`, pretty(x.sql), ''])].join('\n');
    const results = qs.map((x, i) => { let r = null; try { r = lastResult(db.exec(x.sql)); } catch (e) { /* shown as no rows */ }
      return `### ${i + 1}. ${x.title}\n\n${x.question}\n\n${mdTable(r)}\n\n**Your take:** _one sentence on what this shows._`; }).join('\n\n');
    const skills = (t.quests || []).filter(x => !x.boss && !x.ship && !x.mixed).map(x => `- ${x.title}`).join('\n');
    const readme = `# ${name}

${t.mission?.why || `${t.title}, analysed in SQL (SQLite).`}

## Questions

${qs.map((x, i) => `${i + 1}. ${x.question}`).join('\n')}

## Results

${results}

## How to run it

1. Open \`data.db\` in [DB Browser for SQLite](https://sqlitebrowser.org/).
2. Go to **Execute SQL**, open \`report.sql\` and run it.

## What's in here

| File | What it does |
| --- | --- |
| \`report.sql\` | The analysis queries |
| \`data.db\` | The data, as a SQLite database |
${Object.keys(files).map(f => `| \`${f}\` | Part of the project |`).join('\n')}

## Skills used

${skills || '- SQL'}

## Data

${t.dataSource || 'Public or made-up data from the course.'}${src.length ? `\n\nSources: ${src.map(x => `[${x.title}](${x.url})`).join(', ')}` : ''}
`;
    const zip = new window.JSZip(), dir = zip.folder(slug);
    dir.file('README.md', readme); dir.file('report.sql', report);
    for (const [fname, body] of Object.entries(files)) dir.file(fname, body);
    dir.file('data.db', db.export());
    db.close();
    const blob = await zip.generateAsync({ type: 'blob' });
    await dl.save({ filename: `${slug}.zip`, data: blob });
    sx.zipped = 'Saved. Find it in your Downloads folder, right-click, Extract All.';
    sfx.card();
  } catch (e) {
    console.error(e);
    sx.zipped = e && e.code === 'declined' ? 'Download cancelled. Press the button again when you\'re ready.'
      : e && e.code === 'rate_limited' ? 'A save prompt is already open. Finish that one first.'
      : 'Downloads aren\'t available in this view. Open the page on claude.ai in a browser and try again.';
  } finally { sx.zipping = false; render(); }
}

// ---------- actions ----------
let busy = false;
async function guarded(fn) {
  if (busy) return; busy = true;
  try { await fn(); } catch (e) { if (e.message !== 'no db') toast('Couldn\'t save that. Try again in a moment.'); console.error(e); }
  finally { busy = false; }
}

// Saves a quest patch; clears the quest when task + quiz are both done.
async function applyQuest(t, q, patch, quiet) {
  const quests = (t.quests || []).map(x => x.id === q.id ? { ...x, ...patch } : x);
  const nq = quests.find(x => x.id === q.id);
  const cleared = !nq.completedOn && nq.taskDone && (nq.quizBest || 0) >= passMark((nq.quiz || []).length);
  if (cleared) nq.completedOn = today();
  await write('topics/' + t.id, { quests });
  t.quests = quests;
  if (!cleared) { if (patch.taskDone && !quiet) { sfx.card(); toast('Task done. Now prove it.'); } return; }
  const up = await award(q.stat || t.stat, XP.quest, 'quest', t.id, q.title);
  const banked = await markActive('quest');
  for (const c of S.cards.filter(c => c.topic === t.id && c.quest === q.id && !c.due)) await write('cards/' + c.id, { due: addDays(1), gapIdx: 0 });
  if (!S.topics.some(x => x.id === S.player.activeTopic && isActive(x))) { await write('player/me', { activeTopic: t.id }); S.player.activeTopic = t.id; }
  const left = quests.filter(x => !x.completedOn).length, tier = tierOfMastery(S.stats.find(s => s.id === (q.stat || t.stat))?.mastery || 0);
  celebrate({ kicker: q.boss ? 'Boss defeated' : 'Quest cleared', title: q.title, sub: `${banked ? 'Streak day banked. ' : ''}${left ? `${left} quest${left > 1 ? 's' : ''} left in ${t.title}.` : `${t.title} complete.`}`, xp: XP.quest, tier, confetti: true, ok: left ? 'Next' : 'Done' });
  showUps(up);
  if (q.boss) { showUps(await award(t.stat, XP.project, 'project', t.id, t.project || t.title)); celebrate({ kicker: 'Project shipped', title: t.project || t.title, sub: 'Real work on real data, ready to show people.', xp: XP.project, tier, confetti: true, ok: 'Legend' }); }
  if (!left) { await write('topics/' + t.id, { status: 'done' }); showUps(await award(t.stat, XP.topic, 'topic', t.id, t.title)); celebrate({ kicker: 'Topic complete', title: t.title, xp: XP.topic, tier, sound: sfx.level, ok: 'Done' }); }
  render();
}

function checkQuiz(t, q, form) {
  const quiz = q.quiz || [];
  const answers = quiz.map((_, i) => { const r = form.querySelector(`input[name="q${i}"]:checked`); return r ? Number(r.value) : null; });
  if (answers.some(a => a === null)) { toast('Answer every question first.'); return; }
  const score = answers.filter((a, i) => a === quiz[i].answer).length, pm = passMark(quiz.length);
  const missed = answers.map((a, i) => a === quiz[i].answer ? null : i + 1).filter(Boolean);
  const missP = missed.length && S.db ? logEvent('quizmiss', t.id, 0, `${q.id}: missed Q${missed.join(', Q')}`).catch(e => console.error(e)) : Promise.resolve();
  S.quiz = { answers, checked: true, score };
  render();
  const firstPass = score >= pm && (q.quizBest || 0) < pm, flawless = score === quiz.length && (q.quizBest || 0) < quiz.length;
  if (score < pm) { sfx.fail(); return; }
  if (score <= (q.quizBest || 0)) { sfx.pass(); return; }
  guarded(async () => {
    await missP;
    let up = { levelUp: null, rankUp: null };
    if (firstPass) { up = await award(q.stat || t.stat, XP.quiz, 'quiz', t.id, q.title); sfx.pass(); }
    if (flawless) { const u2 = await award(q.stat || t.stat, XP.flawless, 'flawless', t.id, q.title); up.levelUp = up.levelUp || u2.levelUp; up.rankUp = up.rankUp || u2.rankUp; toast(`Flawless. +${XP.flawless} XP bonus`); const fl = (S.player.flawless || 0) + 1; await write('player/me', { flawless: fl }); S.player.flawless = fl; }
    await applyQuest(t, q, { quizBest: score });
    if (!q.taskDone) { showUps(up); render(); }
  });
}

function answerCard(got) {
  const c = mixedDue()[0]; if (!c) return;
  guarded(async () => {
    const gapIdx = got ? Math.min((c.gapIdx || 0) + 1, GAPS.length - 1) : 0;
    const due = addDays(got ? GAPS[gapIdx] : 1);
    // A forgotten card gets a refresher lesson in the Quest Log until they read it.
    const extra = got ? {} : { lapses: (c.lapses || 0) + 1, remind: true };
    await write('cards/' + c.id, { gapIdx, due, lastOn: today(), ...extra });
    Object.assign(c, { gapIdx, due }, extra);
    S.view = { name: 'review', flipped: null }; render();
    let up = null;
    if (got) { up = await award(c.stat, XP.card, 'card', c.topic, ''); sfx.card(); const cg = (S.player.cardsGot || 0) + 1; await write('player/me', { cardsGot: cg }); S.player.cardsGot = cg; }
    const banked = await markActive('card');
    if (S.view.name === 'review') render();
    if (banked) toast('3 cards done. Streak day banked.');
    if (up) showUps(up);
  });
}

// ---------- boot ----------
function start(hot) {
  if (hot && hot.view) { S.view = hot.view; S.quiz = hot.quiz || {}; }
  render();
  (async () => {
    const db = await window.claude?.use?.('db');
    if (!db) { S.loaded = true; render(); toast('Open this page signed in to load your progress.'); return; }
    S.db = db;
    window.claude.use('assets').then(a => { S.assets = a; if (a) render(); }).catch(() => {});
    window.claude.use('sample').then(f => { S.sample = f; if (f) render(); }).catch(() => {});
    let pending = 4;
    const ready = () => { if (pending > 0 && --pending === 0) S.loaded = true; render(); };
    const fail = e => { console.error(e); S.loaded = true; render(); };
    db.doc('player/me').onSnapshot(s => { S.player = s.exists ? { exists: true, ...s.data() } : {}; ready(); }, fail);
    db.collection('stats').onSnapshot(s => { S.stats = s.docs.map(d => ({ id: d.id, ...d.data() })); ready(); }, fail);
    db.collection('topics').onSnapshot(s => { S.topics = s.docs.map(d => ({ id: d.id, ...d.data() })); ready(); }, fail);
    db.collection('cards').onSnapshot(s => { S.cards = s.docs.map(d => ({ id: d.id, ...d.data() })); ready(); }, fail);
    db.collection('requests').onSnapshot(s => { S.requests = s.docs.map(d => ({ id: d.id, ...d.data() })); if (S.loaded) render(); }, e => console.error(e));
    db.collection('offers').onSnapshot(s => { S.offers = s.docs.map(d => ({ id: d.id, ...d.data() })); if (S.loaded) render(); }, e => console.error(e));
    db.collection('trials').onSnapshot(s => { S.trials = s.docs.map(d => ({ id: d.id, ...d.data() })); if (S.loaded) render(); }, e => console.error(e));
    db.doc('log/' + today().slice(0, 7)).onSnapshot(s => { S.log = s.exists ? (s.data().entries || []) : []; if (S.loaded) render(); }, e => console.error(e));
  })();
}
window.claude?.hot?.snapshot?.(() => ({ view: S.view, quiz: S.quiz }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
